name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app and tests
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compile app, extensions, and test targets
        run: >-
          xcodebuild
          -project React.xcodeproj
          -scheme React
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/ReactDerivedData"
          -onlyUsePackageVersionsFromResolvedFile
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
